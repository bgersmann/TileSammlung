<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/icons.js"></script>
<style>
    :root {
        /* --accent-color, --content-color and --card-color are provided by the html-sdk. */
        --on-accent: #101114;
        --ok: #19d400;
        --warn: #f5b800;
        --err: #f55143;
        --muted: rgba(128, 128, 128, .95);
        --muted: color-mix(in srgb, var(--content-color) 62%, transparent);
        --track: rgba(128, 128, 128, .22);
        --track: color-mix(in srgb, var(--content-color) 14%, transparent);
        --line: rgba(128, 128, 128, .18);
        --line: color-mix(in srgb, var(--content-color) 10%, transparent);
        --idle: rgba(128, 128, 128, .55);
        --idle: color-mix(in srgb, var(--content-color) 35%, transparent);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    /* The margins of the html-sdk become padding, so that the height of the tile is known. */
    body { margin: 0 !important; }
    #t { height: 100%; display: flex; flex-direction: column; gap: .6em; overflow: hidden; }
    .hid { display: none !important; }
    .narrow .wide-only { display: none !important; }

    .head { display: flex; align-items: center; gap: .7em; min-width: 0; flex: none; }
    .ic { position: relative; font-size: 1.3em; width: 1.3em; text-align: center; flex: none; line-height: 1; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle); }
    .ic .dot { position: absolute; right: -4px; bottom: -3px; box-shadow: 0 0 0 2px var(--card-color); }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    /* Rundes Foto statt Icon; bleibt auch mit Titelleiste sichtbar. */
    .av { position: relative; width: 2.2em; height: 2.2em; flex: none; }
    .av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .av .dot { position: absolute; right: -2px; bottom: -2px; box-shadow: 0 0 0 2px var(--card-color); }
    .titled .head .av { display: block; }

    .ht { min-width: 0; line-height: 1.25; flex: 1; }
    .ht div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: .78em; color: var(--muted); }
    /* Symcon draws icon and name itself when the tile has a title bar. */
    .head .inline-dot { display: none; }
    .titled .head { gap: .45em; }
    .titled .head .ic, .titled .head .name { display: none; }
    .titled .head .inline-dot { display: inline-block; margin-right: 2px; }

    .barx { min-width: 0; flex: none; }
    .barx .r { display: flex; justify-content: space-between; gap: .5em; font-size: .76em; line-height: 1.35; color: var(--muted); }
    .barx .r span { white-space: nowrap; }
    .barx .r span:last-child { color: var(--content-color); }
    .track { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 2px; }
    .track i { display: block; height: 100%; background: var(--accent-color); border-radius: 3px; transition: width .6s; }
    .track i.warn { background: var(--warn); }
    .track i.err { background: var(--err); }

    .sws { display: flex; gap: .45em; flex: none; }
    .sw { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px;
          padding: .4em .3em; border-radius: 10px; border: 0; font: inherit; font-size: .8em; color: inherit;
          background: var(--track); cursor: pointer; transition: transform .1s; white-space: nowrap; overflow: hidden; }
    .sw:active { transform: scale(.95); }
    .sw.on { background: var(--accent-color); color: var(--on-accent); }
    .sw.noaction { cursor: default; opacity: .55; }
    .sw span { overflow: hidden; text-overflow: ellipsis; }
    .sw i { flex: none; }

    .kpis { display: flex; gap: .55em; flex: none; }
    .kpi { flex: 1 1 0; min-width: 0; line-height: 1.15; }
    .kpi .v { font-size: 1.35em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi .l { font-size: .74em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .rows { display: flex; flex-direction: column; flex: none; }
    .row { display: flex; justify-content: space-between; gap: .85em; padding: .26em 0; border-top: 1px solid var(--line); font-size: .85em; line-height: 1.3; }
    .row.first { border-top: 0; }
    .row span:first-child { color: var(--muted); white-space: nowrap; }
    .row span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .grp { display: flex; align-items: center; gap: .6em; min-width: 0; margin-top: .2em;
           font-size: .74em; color: var(--muted); flex: none; }
    .grp span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .grp::before { content: ""; width: 3px; height: 1em; border-radius: 2px; background: var(--accent-color); flex: none; }
    .grp::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .week { flex: none; min-width: 0; }
    .week .r { display: flex; justify-content: space-between; gap: .5em; font-size: .76em; line-height: 1.35; color: var(--muted); }
    .week .r span:last-child { color: var(--content-color); white-space: nowrap; }
    .wgraph { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin-top: 4px; }
    .wgraph i { flex: 1 1 0; min-width: 2px; border-radius: 2px 2px 0 0; background: var(--accent-color); }
    .wgraph i.zero { height: 2px !important; background: var(--track); border-radius: 1px; }
    .wlabels { display: flex; gap: 3px; font-size: .64em; color: var(--muted); margin-top: 2px; }
    .wlabels span { flex: 1 1 0; text-align: center; white-space: nowrap; overflow: hidden; }

    [data-open] { cursor: pointer; }
    .empty { margin: auto; text-align: center; color: var(--muted); font-size: .9em; }
</style>

<div id="t"></div>

<script>
    // Initial state of the instance; afterwards the module pushes the complete state as JSON.
    let state = /*INITIAL_STATE*/null;

    const params = new URLSearchParams(window.location.search);
    const px = (name, fallback) => {
        const value = parseFloat(params.get(name));
        return isNaN(value) ? fallback : value;
    };
    const padTop = px('margintop', 15), padSide = px('marginside', 15), padBottom = px('marginbottom', 15);
    const box = document.getElementById('t');
    box.style.padding = `${padTop}px ${padSide}px ${padBottom}px`;
    // The visualization reserves a larger top margin when it draws a title bar itself.
    if (padTop >= 40) {
        document.body.classList.add('titled');
    }

    const T = (text) => (typeof translate === 'function' ? translate(text) : text);
    // Values come from variable formatting and names from the configuration: never treat them as markup.
    const E = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const num = (value, digits = 0) => Number(value).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
    const has = (value) => value !== undefined && value !== null && value !== '';
    const clamp = (value) => Math.max(0, Math.min(100, Number(value) || 0));
    // Symcon's own icons are registered under the kit prefix only, so the family is chosen per icon.
    const isKitIcon = (name) => {
        try {
            return !!window['___FONT_AWESOME___'].styles.fak[name];
        } catch (e) {
            return false;
        }
    };
    const icon = (name) => `<i class="${isKitIcon(name) ? 'fa-kit' : 'fa-light'} fa-${E(name)}"></i>`;

    // Clicking a value opens its variable in the visualization.
    const openAttr = (key) => {
        const id = state && state.open ? Number(state.open[key] || 0) : 0;
        return id > 0 ? `data-open="${id}"` : '';
    };

    const kpis = (items) => {
        const visible = items.filter((i) => has(i[0]));
        return visible.length ? `<div class="kpis">${visible.map(([value, label, p, key]) => `<div class="kpi" ${p ? `data-p="${p}"` : ''} ${key ? openAttr(key) : ''}><div class="v">${E(value)}</div><div class="l">${E(label)}</div></div>`).join('')}</div>` : '';
    };
    // Rows without a value are left out; the first visible row has no separator line.
    const rows = (items) => {
        const visible = items.filter((r) => has(r[1]));
        return visible.length ? `<div class="rows">${visible.map(([key, value, p, openKey], i) => `<div class="row ${i === 0 ? 'first' : ''}" ${p ? `data-p="${p}"` : ''} ${openKey ? openAttr(openKey) : ''}><span>${E(key)}</span><span>${E(value)}</span></div>`).join('')}</div>` : '';
    };

    // Letzte Gassi-Runden als Zeilen plus Wochen-Graph mit km pro Tag aus dem Archiv.
    function walksBlock(s) {
        if (!s.walks) {
            return '';
        }
        let html = '';
        const list = s.walks.list || [];
        if (list.length) {
            html += `<div class="grp" ${openAttr('walks')}><span>${E(T('Walks'))}</span></div>`;
            html += `<div class="rows">${list.map((w, i) => `<div class="row ${i === 0 ? 'first' : ''}" ${i > 0 ? `data-p="${3 + i}"` : ''} ${openAttr('walks')}><span>${E(w.when)}</span><span>${E(w.text)}</span></div>`).join('')}</div>`;
        }
        const days = s.walks.days || [];
        if (days.length) {
            const total = days.reduce((sum, d) => sum + (Number(d.v) || 0), 0);
            const max = Math.max(...days.map((d) => Number(d.v) || 0), 0.1);
            const bars = days.map((d) => {
                const value = Number(d.v) || 0;
                const height = value > 0 ? Math.max(4, Math.round(value / max * 100)) : 0;
                return `<i class="${value > 0 ? '' : 'zero'}" style="height:${height}%" title="${new Date(d.t * 1000).toLocaleDateString()} · ${num(value, value % 1 ? 1 : 0)} km"></i>`;
            }).join('');
            const labels = days.map((d) => `<span>${E(new Date(d.t * 1000).toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2))}</span>`).join('');
            html += `<div class="week" data-p="3" ${openAttr('walks')}><div class="r"><span>${E(T('km this week'))}</span><span>${num(total, total % 1 ? 1 : 0)} km</span></div>
                <div class="wgraph">${bars}</div><div class="wlabels">${labels}</div></div>`;
        }
        return html;
    }

    function render() {
        if (!state) {
            return;
        }
        if (state.inactive) {
            box.innerHTML = `<div class="empty">${E(T('Instance inactive'))}</div>`;
            return;
        }
        const dot = state.away === true ? 'warn' : (has(state.status) || state.away === false) ? 'ok' : '';
        const sub = [state.status, state.awayText].filter(has).join(' · ');
        let bar = '';
        if (has(state.battery)) {
            const battery = clamp(state.battery);
            const cls = battery <= 10 ? 'err' : battery <= 20 ? 'warn' : '';
            bar = `<div class="barx" ${openAttr('battery')}><div class="r"><span>${E(T('Battery'))}</span><span>${E(state.batteryText ?? `${num(battery)} %`)}</span></div>
                <div class="track"><i class="${cls}" style="width:${battery}%"></i></div></div>`;
        }
        const switches = (state.switches || []).length ? `<div class="sws" data-p="2">${state.switches.map((s) => `<button class="sw ${s.on ? 'on' : ''} ${s.action ? '' : 'noaction'}" ${s.action ? `data-press="${Number(s.id)}"` : `data-open="${Number(s.id)}"`} title="${E(T(s.label))}">${icon(s.icon)}<span class="wide-only">${E(T(s.label))}</span></button>`).join('')}</div>` : '';
        const avatar = has(state.image)
            ? `<div class="av"><img src="${E(state.image)}" alt=""><span class="dot ${dot}"></span></div>`
            : `<div class="ic">${icon(state.icon)}<span class="dot ${dot}"></span></div>`;
        box.innerHTML = `<div class="head">
                ${avatar}
                <div class="ht"><div class="name">${E(state.name)}</div>${sub ? `<div class="sub" ${openAttr('status')}><span class="dot inline-dot ${dot}"></span>${E(sub)}</div>` : ''}</div>
            </div>
            ${bar}
            ${switches}
            ${kpis([
                [state.speed, T('Speed'), 0, 'speed'],
                [state.accuracy, T('Accuracy'), 4, 'accuracy']
            ])}
            ${rows([
                [T('Last position'), state.lastPos, 0, 'lastPos'],
                [T('Day sleep'), state.daySleep, 5, 'daySleep'],
                [T('Night sleep'), state.nightSleep, 6, 'nightSleep'],
                [T('Rest phase'), state.rest, 7, 'rest'],
                [T('Sensor'), state.sensor, 8, 'sensor'],
                [T('Altitude'), state.altitude, 9, 'altitude']
            ])}
            ${walksBlock(state)}`;
        fit();
    }

    // Fits the content into the tile: everything marked with data-p is hidden,
    // the highest number first, until nothing overflows.
    function fit() {
        const width = box.clientWidth - padSide * 2;
        document.body.classList.toggle('narrow', width < 200);
        box.querySelectorAll('.hid').forEach((e) => e.classList.remove('hid'));
        const overflow = () => box.scrollHeight > box.clientHeight + 1;
        const steps = [...new Set([...box.querySelectorAll('[data-p]')].map((e) => Number(e.dataset.p)))].sort((a, b) => b - a);
        for (const step of steps) {
            if (!overflow()) {
                break;
            }
            const items = [...box.querySelectorAll(`[data-p="${step}"]`)].reverse();
            for (const item of items) {
                if (!overflow()) {
                    break;
                }
                item.classList.add('hid');
            }
        }
    }

    window.handleMessage = (data) => {
        const next = typeof data === 'string' ? JSON.parse(data) : data;
        // Pushes lassen das Bild weg: das vorhandene bleibt erhalten.
        if (next.image === undefined && state && state.image) {
            next.image = state.image;
        }
        state = next;
        render();
    };

    box.addEventListener('click', (event) => {
        const press = event.target.closest('[data-press]');
        if (press) {
            if (typeof requestAction === 'function') {
                requestAction('Press', Number(press.dataset.press));
            }
            return;
        }
        const target = event.target.closest('[data-open]');
        if (target && typeof openObject === 'function') {
            openObject(Number(target.dataset.open));
        }
    });

    window.addEventListener('resize', fit);
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fit);
    }
    render();
</script>
